name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.3.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Update version in package.json
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Verify build artifact
        run: |
          $artifact = "build\sshfs-win-manager-setup-v${{ github.event.inputs.version }}.exe"
          if (-not (Test-Path $artifact)) {
            Write-Error "Build artifact not found: $artifact"
            exit 1
          }
          Write-Output "Build artifact found: $artifact"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: build/sshfs-win-manager-setup-v${{ github.event.inputs.version }}.exe
          generate_release_notes: true
